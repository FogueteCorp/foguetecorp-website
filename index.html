<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Coming Soon - Athlete Portfolio">
    <title>Coming Soon - Foguete CORP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0f0f0f;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent-orange: #ff6b35;
            --accent-orange-hover: #ff8555;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 107, 53, 0.03) 2px,
                    rgba(255, 107, 53, 0.03) 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 107, 53, 0.03) 2px,
                    rgba(255, 107, 53, 0.03) 4px
                );
            opacity: 0.5;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Radial gradient overlay */
        body::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at center,
                rgba(255, 107, 53, 0.1) 0%,
                transparent 50%
            );
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 3rem;
            color: var(--text-primary);
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .highlight {
            color: var(--accent-orange);
        }

        p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.6;
            animation: fadeInUp 1s ease-out 0.7s both;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            background-color: rgba(255, 107, 53, 0.05);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .social-link:hover {
            border-color: var(--accent-orange);
            background-color: rgba(255, 107, 53, 0.1);
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.2);
        }

        .social-icon {
            width: 24px;
            height: 24px;
            stroke: var(--text-primary);
            transition: stroke 0.3s ease;
        }

        .social-link:hover .social-icon {
            stroke: var(--accent-orange);
        }

        .social-icon-fill {
            fill: var(--text-primary);
            transition: fill 0.3s ease;
        }

        .social-link:hover .social-icon-fill {
            fill: var(--accent-orange);
        }

        .email-notify {
            display: flex;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto 2rem;
            animation: fadeInUp 1s ease-out 1.1s both;
        }

        .email-input {
            flex: 1;
            padding: 1rem 1.5rem;
            background-color: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(255, 107, 53, 0.3);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .email-input::placeholder {
            color: var(--text-secondary);
        }

        .email-input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .notify-btn {
            padding: 1rem 2rem;
            background-color: var(--accent-orange);
            color: var(--primary-dark);
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .notify-btn:hover {
            background-color: var(--accent-orange-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.4);
        }

        .countdown {
            font-size: 0.9rem;
            color: var(--text-secondary);
            animation: fadeInUp 1s ease-out 1.3s both;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            p {
                font-size: 1.1rem;
            }

            .email-notify {
                flex-direction: column;
            }

            .notify-btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .social-links {
                gap: 1rem;
            }

            .social-link {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Foguete <span class="highlight">CORP</span></div>
        
        <h1>Something <span class="highlight">Amazing</span><br>Is Coming Soon</h1>
        
        <p>I'm working on my new portfolio to showcase my journey, achievements, and what drives me as an athlete. Stay tuned!</p>
        
        <div class="social-links">
            <!-- Instagram -->
            <a href="https://instagram.com/foguetecorp" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@foguetecorp" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                    <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                </svg>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@foguetecorp" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
                <svg class="social-icon-fill" viewBox="0 0 24 24" width="24" height="24">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
            </a>

            <!-- X (Twitter) -->
            <a href="https://x.com/foguetecorp" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
                <svg class="social-icon-fill" viewBox="0 0 24 24" width="24" height="24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </a>
        </div>

        <div class="email-notify">
            <input type="email" class="email-input" placeholder="Enter your email" aria-label="Email address">
            <button class="notify-btn">Notify Me</button>
        </div>

        <div class="countdown">Launching Soon</div>
    </div>
</body>
</html>
