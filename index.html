    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
  }
  
  h1 {
    font-weight: 700;
    margin-bottom: 0.25em;
  }

    color: #bbb;
    margin-top: 0;
    margin-bottom: 2rem;
    font-size: 1.1rem;
  }

    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  
  a {
    text-decoration: none;
    color: #eee;
    font-weight: 600;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: color 0.3s ease;
  }
  
  a:hover {
    color: #1da1f2; /* Twitter blue as a nice accent */
  }
  
  /* Simple social icons using SVG */
  a svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }
  
  footer {
    margin-top: 4rem;
    font-size: 0.9rem;
    color: #666;
  }
